.opts{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.opts button{height:38px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:8px;font-size:12px;cursor:pointer}
.opts button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;justify-content:center}

.row{display:flex;align-items:center;gap:10px;margin:8px 0}.rk{width:22px;color:var(--mu);font-weight:700}.nm{flex:1;min-width:0}.nm b{display:block;overflow-wrap:anywhere}.tr{height:8px;background:var(--ac2);border-radius:4px;margin-top:4px}.tr i{display:block;height:100%;background:var(--ac);border-radius:4px}.pc{font-weight:700;width:52px;text-align:right}

const items=[];
D.q.forEach((q,i)=>{
  items.push({i,ax:0,t:q.t,neg:q.xL,pos:q.xR,s:8.5});
  items.push({i,ax:1,t:q.t,neg:q.yD,pos:q.yU,s:4});
});
const ans=Array(items.length).fill(null);
const qs=document.getElementById('qs');
items.forEach((it,k)=>{
  const c=document.createElement('div');
  c.className='card';
  c.innerHTML=`<div class="qt">Q${it.i+1} · ${it.ax?'纵轴':'横轴'}</div><div class="qn">${it.t}</div><div class="ends"><span>${it.neg}</span><span>${it.pos}</span></div><div class="opts">${[1,2,3,4,5,6,7].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>`;
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.n;
    ans[k]=ans[k]===n?null:n;
    c.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.n===ans[k]));
    upd();
  });
  qs.appendChild(c);
});
const go=document.getElementById('go');
function upd(){
  const n=ans.filter(v=>v!=null).length;
  document.getElementById('cnt').textContent=n+' / 26';
  go.disabled=n<8;
}
go.onclick=()=>{
  const used=items.map((it,k)=>ans[k]==null?null:(ans[k]-4)/3);
  const sc=D.n.map((nm,ci)=>{
    let s=0,m=0;
    items.forEach((it,k)=>{
      if(used[k]==null)return;
      const a=Math.max(-1,Math.min(1,D.c[ci][it.i][it.ax]/it.s));
      s+=(a-used[k])**2;
      m++;
    });
    const r=Math.sqrt(s/m);
    return{nm,p:Math.max(0,Math.round(100*(1-r/1.5)))};
  }).sort((a,b)=>b.p-a.p);
  const top=sc.slice(0,5),last=sc[sc.length-1];
  const res=document.getElementById('res');
  res.innerHTML=`<div class="card"><h1>和你最相近的角色</h1>${top.map((t,i)=>`<div class="row"><div class="rk">${i+1}</div><div class="nm"><b>${t.nm}</b><div class="tr"><i style="width:${t.p}%"></i></div></div><div class="pc">${t.p}%</div></div>`).join('')}<p class="sub">最不相近：${last.nm}（${last.p}%）</p><button class="btn g" onclick="location.reload()">重新作答</button></div>`;
  res.scrollIntoView({behavior:'smooth'});
};
